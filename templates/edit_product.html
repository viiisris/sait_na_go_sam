<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование товара</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #2196F3;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0b7dda;
        }
        .cancel-link {
            display: inline-block;
            margin-left: 10px;
            color: #666;
            text-decoration: none;
        }
        .cancel-link:hover {
            color: #333;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }
        .back-link:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Редактирование товара</h1>
        </header>
        
        <nav>
            <a href="/" class="back-link">← На главную</a>
        </nav>
        
        <main>
            <form method="POST" action="/edit-product/{{.ID}}">
                <div class="form-group">
                    <label for="model">Модель:</label>
                    <input type="text" id="model" name="model" value="{{.Model}}" required>
                </div>
                
                <div class="form-group">
                    <label for="company">Компания:</label>
                    <input type="text" id="company" name="company" value="{{.Company}}" required>
                </div>
                
                <div class="form-group">
                    <label for="price">Цена:</label>
                    <input type="number" id="price" name="price" value="{{.Price}}" required>
                </div>
                
                <button type="submit">Сохранить изменения</button>
                <a href="/" class="cancel-link">Отмена</a>
            </form>
        </main>
    </div>
</body>
</html>
