<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .add-button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .edit-button {
            background-color: #2196F3;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 3px;
            margin-right: 5px;
        }
        .delete-button {
            background-color: #f44336;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        .logout-button {
            background-color: #f44336;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 4px;
            margin-left: 10px;
        }
        .user-info {
            float: right;
            margin-top: 10px;
        }
        .header {
            overflow: hidden;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 style="display: inline-block;">Snippetbox</h1>
        <div class="user-info">
            <span>Привет, {{.User.Username}}!</span>
            <a href="/logout" class="logout-button">Выйти</a>
        </div>
    </div>
    
    <nav>
        <a href="/">Домашняя страница</a>
    </nav>
    
    <main>
        <h2>Список товаров</h2>
        
        <a href="/add-product" class="add-button">+ Добавить товар</a>
        
        {{if .Products}}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Модель</th>
                    <th>Компания</th>
                    <th>Цена</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {{range .Products}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Model}}</td>
                    <td>{{.Company}}</td>
                    <td>{{.Price}} ₽</td>
                    <td class="actions">
                        <a href="/edit-product/{{.ID}}" class="edit-button">Редактировать</a>
                        <form action="/delete-product/{{.ID}}" method="POST" style="display: inline;">
                            <button type="submit" class="delete-button" onclick="return confirm('Вы уверены?')">Удалить</button>
                        </form>
                    </td>
                </tr>
                {{end}}
            </tbody>
        </table>
        {{else}}
        <p>Товаров пока нет!</p>
        {{end}}
    </main>
</body>
</html>
