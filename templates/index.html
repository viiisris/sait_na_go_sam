<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная страница</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .add-button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .add-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href='/'>Домашняя страница</a></h1>
    </header>
    <main>
        <h2>Последние заметки</h2>
        
        <a href="/add-product" class="add-button">+ Добавить товар</a>
        
        {{if .}}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Модель</th>
                    <th>Компания</th>
                    <th>Цена</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody>
                {{range .}}
                <tr>
                    <td>{{.ID}}</td>
                    <td>{{.Model}}</td>
                    <td>{{.Company}}</td>
                    <td>{{.Price}} ₽</td>
                    <td class="actions">
                        <a href="/edit-product/{{.ID}}" class="edit-button">Редактировать</a>
                        <form action="/delete-product/{{.ID}}" method="POST" style="display: inline;">
                            <button type="submit" class="delete-button" onclick="return confirm('Вы уверены, что хотите удалить этот товар?')">Удалить</button>
                        </form>
                    </td>                
                </tr>
                {{end}}
            </tbody>
        </table>
        {{else}}
        <p>Здесь пока ничего нет!</p>
        {{end}}
    </main>
</body>
</html>
